<section id="ink-hero" class="ink-hero" aria-labelledby="ink-hero-title">
  <canvas aria-hidden="true"></canvas>
  <div class="ink-hero__body">
    <h2 id="ink-hero-title">같은 문제에 두 번 막히지 않도록 기록합니다.</h2>
    <p>개발하며 만난 문제를 증상, 원인, 해결 순서로 정리합니다. 지금까지 쓴 글은 {{ site.posts.size }}편입니다.</p>
    <button type="button" class="ink-hero__cmd" data-ink-open-palette>
      글 검색과 이동 <kbd class="ink-kbd">Ctrl K</kbd>
    </button>
  </div>
  <p class="ink-hero__tip">노드를 끌어 보세요. 글 노드를 누르면 글로 이동합니다.</p>
  <script type="application/json" id="ink-graph-data">{"posts":[{% for p in site.posts %}{"t":{{ p.title | jsonify }},"u":{{ p.url | relative_url | jsonify }},"c":{{ p.categories | jsonify }},"g":{{ p.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
</section>
